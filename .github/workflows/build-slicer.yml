name: build-slicer

on:
  push:
    branches: [main]
    paths:
      - 'slicer/**'
      - '.github/workflows/build-slicer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: slicer
          file: slicer/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/luftaquila/lufthafen-3d-slicer:latest
            ghcr.io/luftaquila/lufthafen-3d-slicer:${{ github.sha }}
          cache-from: type=gha,scope=slicer
          cache-to: type=gha,mode=max,scope=slicer
